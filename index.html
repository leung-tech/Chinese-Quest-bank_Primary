<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星際字詞守衛隊 | 時空探險局</title>
    
    <!-- 【UDL 設計】：強制載入 Noto Sans HK，棄用明體/宋體以減低 SpLD 視覺混淆 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           無障礙核心設計 (CSS) - 融入科幻輕主題
           ========================================= */
        :root {
            /* 預設米黃色背景，減低視覺疲勞 (SpLD 友善) */
            --bg-color: #FFF8E7; 
            --text-color: #2C3E50;
            /* 科技感藍色按鈕 (ASD 友善：統一明確) */
            --btn-primary: #3498DB; 
            --btn-hover: #2980B9;
        }

        body {
            font-family: 'Noto Sans HK', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            /* 行距 1.8 倍，字距拉寬 (SpLD 友善) */
            line-height: 1.8;
            letter-spacing: 1.5px;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease; 
        }

        /* 【ASD 全局一致性開關】切換此 class 將關閉所有過場與動畫 */
        body.disable-animations * {
            animation: none !important;
            transition: none !important;
        }

        /* 駕駛艙控制台設計：極簡且聚焦 (ADHD 極致專注模式) */
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            /* 加入輕微的科技感發光邊框 */
            border: 3px solid #E3F2FD;
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.15);
            margin-top: 50px;
            box-sizing: border-box;
        }

        .title-icon {
            font-size: 3em;
            margin-bottom: -10px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            color: #2C3E50;
            line-height: 1.3;
        }

        .highlight {
            color: #E67E22; /* 活力橙色，吸引注意力 */
        }

        p {
            font-size: 1.25em;
            margin-bottom: 35px;
            color: #5D6D7E;
        }

        button {
            font-family: 'Noto Sans HK', sans-serif;
            background-color: var(--btn-primary);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.3em;
            border-radius: 50px; /* 圓潤的按鈕更具親和力 */
            cursor: pointer;
            margin: 10px;
            letter-spacing: 2px;
            transition: all 0.2s;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #95A5A6;
            cursor: not-allowed;
            transform: none;
        }

        /* 火箭升空動畫 (ADHD 視覺回饋) */
        @keyframes rocketBlast {
            0% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0); }
        }
        .rocket-anim {
            display: inline-block;
            animation: rocketBlast 0.4s infinite ease-in-out;
        }

        /* =========================================
           SEN 友善輸入框設計 (改良版)
           ========================================= */
        .input-group {
            /* 【改良】加大垂直距離，確保 SpLD 學生閱讀時畫面清晰不擁擠 */
            margin-bottom: 35px; 
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 1.25em;
            margin-bottom: 10px;
            color: #34495E;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 18px; /* 加大點擊與填寫範圍 */
            font-size: 1.2em;
            border: 2px solid #BDC3C7;
            border-radius: 12px;
            box-sizing: border-box;
            font-family: 'Noto Sans HK', sans-serif;
            transition: all 0.3s;
            background-color: #F8F9F9;
        }

        /* 點擊輸入框時的高對比提示 (ADHD/SpLD 友善) */
        .input-group input:focus {
            outline: none;
            border-color: #3498DB;
            background-color: #FFFFFF;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }

        /* 無標籤的 UDL 工具列 */
        .udl-toolbar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .udl-btn {
            background-color: #F2F4F4;
            color: #34495E;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 20px;
            box-shadow: none;
        }

        .udl-btn:hover {
            background-color: #E5E8E8;
        }

        /* 沉浸式飛船系統提示框 */
        #message-box {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: #E8F8F5; /* 科技感淺薄荷綠 */
            color: #117A65;
            border-radius: 12px;
            border: 2px solid #A3E4D7;
            font-size: 1.2em;
            font-weight: bold;
            /* 柔和淡入效果 */
            animation: smoothFadeIn 0.8s ease forwards;
            opacity: 0;
        }

        @keyframes smoothFadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 護眼與語音設定區 (無標籤設計) -->
    <div class="udl-toolbar">
        <button class="udl-btn" onclick="changeTheme('beige')">👁️ 星艦護眼 (黃)</button>
        <button class="udl-btn" onclick="changeTheme('pink')">👁️ 星艦護眼 (粉)</button>
        <button class="udl-btn" onclick="readAloud('歡迎加入星際字詞守衛隊！請填寫探險家資料並啟動飛船。')">🔊 飛船語音導航</button>
        <!-- 【新增】：ASD 全局一致性開關 -->
        <button class="udl-btn" id="anim-toggle-btn" onclick="toggleAnimation()">✨ 關閉動態效果</button>
    </div>

    <!-- 飛船駕駛艙 (主介面) -->
    <div class="container">
        <div class="title-icon">🌌</div>
        <h1>星際字詞守衛隊<br><span class="highlight">時空探險局</span></h1>
        <p id="welcome-text">歡迎加入！請啟動您的飛船，系統將自動記錄您的探險日誌。</p>
        
        <!-- 學生資料填寫表單 -->
        <form id="login-form" onsubmit="event.preventDefault(); startAdventure();">
            <div class="input-group">
                <label for="student-name">🆔 探險家代號</label>
                <input type="text" id="student-name" required placeholder="例如：陳大文">
            </div>
            
            <div class="input-group">
                <label for="student-class">🌌 所屬編隊 (如 5A)</label>
                <input type="text" id="student-class" required placeholder="例如：5A">
            </div>

            <!-- 【防呆設定】：type="number" 保證自動彈出數字鍵盤及限制輸入 -->
            <div class="input-group">
                <label for="class-number">🔢 飛船登陸號 (學號)</label>
                <input type="number" id="class-number" required placeholder="例如：12" min="1">
            </div>

            <!-- One-thing-at-a-time：將按鈕放入表單內，確保驗證通過才執行 -->
            <button type="submit" id="login-btn">🚀 啟動時空飛船 (登入)</button>
        </form>

        <!-- 飛船系統提示訊息顯示區 -->
        <div id="message-box"></div>
    </div>

    <!-- =========================================
         系統邏輯與 Firebase 接入點 (JavaScript)
         ========================================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvE67iAYoA9Z5zElGqTT0kpXEhuVzsa_I",
            authDomain: "chinesequest-primary.firebaseapp.com",
            projectId: "chinesequest-primary",
            storageBucket: "chinesequest-primary.firebasestorage.app",
            messagingSenderId: "442065508277",
            appId: "1:442065508277:web:299279646ef236fa27abfc",
            measurementId: "G-50SZSD2GCL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const sysAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        window.startAdventure = async function() {
            const studentName = document.getElementById('student-name').value.trim();
            const studentClass = document.getElementById('student-class').value.trim();
            const classNumber = document.getElementById('class-number').value.trim();

            if (typeof window.playSuccessSound === 'function') {
                window.playSuccessSound();
            }
            
            const btn = document.getElementById('login-btn');
            // 【動畫改良】：動態火箭升空動畫
            btn.innerHTML = '<span class="rocket-anim">🚀</span> 時空飛船啟動中...';
            btn.disabled = true;

            const msgBox = document.getElementById('message-box');
            msgBox.style.display = 'block';
            msgBox.innerHTML = '✨ 正在連接系統安全協議...';

            try {
                const userCredential = await signInAnonymously(auth);
                const user = userCredential.user;

                const userDocRef = doc(db, 'artifacts', sysAppId, 'users', user.uid, 'profile', 'info');
                await setDoc(userDocRef, {
                    name: studentName,
                    class: studentClass,
                    classNumber: classNumber,
                    joinedAt: new Date().toISOString()
                });

                msgBox.innerHTML = `✅ 身份確認！歡迎 ${studentName} 隊員。<br>正在開啟時空蟲洞，準備跳轉至文字星系...`;
                
                // 【預留位置：未來可以在這裡加入專屬的短促確認音效】
                // if (typeof window.playConfirmedSound === 'function') { window.playConfirmedSound(); }

                setTimeout(() => {
                    window.location.href = 'game.html';
                }, 2500);

            } catch (error) {
                console.error("登入錯誤:", error);
                msgBox.style.backgroundColor = '#FDEDEC';
                msgBox.style.color = '#C0392B';
                msgBox.innerHTML = '❌ 系統連線失敗，請檢查網絡後再試一次。';
                
                btn.innerHTML = '🚀 重新啟動飛船';
                btn.disabled = false;
            }
        };
    </script>

    <!-- 獨立的無障礙功能腳本 -->
    <script>
        function changeTheme(color) {
            if (color === 'beige') {
                document.documentElement.style.setProperty('--bg-color', '#FFF8E7');
            } else if (color === 'pink') {
                document.documentElement.style.setProperty('--bg-color', '#FFF0F5');
            }
        }

        function readAloud(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-HK'; 
                utterance.rate = 0.85;    
                window.speechSynthesis.speak(utterance);
            } else {
                const msgBox = document.getElementById('message-box');
                msgBox.style.display = 'block';
                msgBox.style.backgroundColor = '#FDEDEC';
                msgBox.style.color = '#C0392B';
                msgBox.innerHTML = '通訊系統故障：您的瀏覽器暫時不支援語音導航。';
            }
        }

        // 【新增】：ASD 動態效果開關控制
        function toggleAnimation() {
            document.body.classList.toggle('disable-animations');
            const btn = document.getElementById('anim-toggle-btn');
            if (document.body.classList.contains('disable-animations')) {
                btn.innerHTML = '✨ 開啟動態效果';
            } else {
                btn.innerHTML = '✨ 關閉動態效果';
            }
        }

        window.playSuccessSound = function() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.3); 
                gainNode.gain.setValueAtTime(0.2, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {
                console.log("Audio requires user interaction");
            }
        };
    </script>
</body>
</html>
